<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="auth-card">
    <h1>User Login</h1>
    <div class="msg error" id="login-msg"></div>
    <input class="field" id="li-username" type="text" placeholder="Username">
    <input class="field" id="li-password" type="password" placeholder="Password">
    <button class="btn" id="login-btn">Login</button>
    <a class="switch-link" href="signup.html">Create New Account</a>
  </div>

  <script src="script.js"></script>
  <script>initLogin();</script>
</body>
</html>
