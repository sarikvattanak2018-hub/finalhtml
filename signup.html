<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Account</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="auth-card">
    <h1>Create Account</h1>
    <div class="msg error" id="signup-msg"></div>
    <input class="field" id="su-username" type="text" placeholder="Username">
    <input class="field" id="su-email" type="email" placeholder="Email">
    <input class="field" id="su-password" type="password" placeholder="Password">
    <button class="btn" id="signup-btn">Sign Up</button>
    <a class="switch-link" href="login.html">Back to Login</a>
  </div>

  <script src="script.js"></script>
  <script>initSignup();</script>
</body>
</html>
